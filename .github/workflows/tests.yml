name: Tests, cobertura y SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pruebas automatizadas, cobertura y compilación
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Ejecutar pruebas y generar cobertura
        run: npx --yes c8@10.1.3 --include='assets/js/product-image-url.js' --include='services/*/src/**/*.js' --reporter=text --reporter=lcov --reports-dir=coverage npm test

      - name: Compilar aplicación
        run: npm run build

      - name: Publicar informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bunkergym-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

      - name: Analizar con SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
