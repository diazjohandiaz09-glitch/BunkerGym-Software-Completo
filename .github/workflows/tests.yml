name: Tests, cobertura y SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pruebas automatizadas, cobertura y compilación
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Obtener el código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias bloqueadas sin ejecutar scripts
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Ejecutar pruebas y generar cobertura
        run: npm run test:coverage
        env:
          BUNKER_KEEP_INTEGRATION_WORKSPACE: '1'

      - name: Limpiar entornos temporales de integración
        if: always()
        run: rm -rf .bunker-integration-*

      - name: Compilar aplicación
        run: npm run build

      - name: Publicar informe de cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bunkergym-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

      - name: Analizar con SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
