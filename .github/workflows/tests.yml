name: Tests, cobertura y SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pruebas automatizadas, cobertura y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Obtener el código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Verificar el manifiesto y el lockfile
        run: |
          pwd
          ls -la package.json package-lock.json
          git ls-files package-lock.json
          test -s package-lock.json

      - name: Instalar dependencias bloqueadas sin ejecutar scripts de terceros
        run: npm ci --prefix "$GITHUB_WORKSPACE" --ignore-scripts --no-audit --no-fund

      - name: Ejecutar pruebas con cobertura nativa de Node.js
        env:
          NODE_V8_COVERAGE: coverage/v8
        run: |
          mkdir -p coverage/v8
          npm test -- --experimental-test-coverage

      - name: Compilar aplicación
        run: npm run build

      - name: Publicar datos de cobertura V8
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bunkergym-v8-coverage
          path: coverage/v8/
          if-no-files-found: warn
          retention-days: 14

      - name: Analizar con SonarCloud
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
