name: Tests y cobertura

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pruebas automatizadas y cobertura
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas y generar LCOV
        run: npx --yes c8@10.1.3 --include=assets/js/product-image-url.js --reporter=text --reporter=lcov --reports-dir=coverage npm test

      - name: Compilar aplicación
        run: npm run build

      - name: Publicar informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bunkergym-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14
